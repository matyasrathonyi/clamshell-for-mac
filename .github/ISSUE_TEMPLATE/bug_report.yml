name: Bug report
description: Clamshell did something wrong or unexpected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This tracker is public.

        Please do not paste Terminal output, logs, diagnostics, license keys or email addresses here. If support needs more detail, use Settings > General > Copy diagnostics for support in Clamshell and email the report to hello@clamshell.dev.
  - type: input
    id: version
    attributes:
      label: Clamshell version
      description: For example 2.0.0.
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Where did you get Clamshell?
      options:
        - clamshell.dev
        - Homebrew
        - Setapp
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu > About This Mac.
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      description: Apple menu > About This Mac.
      placeholder: "MacBook Air M3, 13-inch, 2024"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw in your own words.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How you armed Clamshell, whether you were on battery or power, whether a display was connected, and which modules were on.
      placeholder: |
        1. Armed from the menu bar, on battery
        2. Closed the lid
        3. ...
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I did not paste Terminal output, logs, diagnostics or personal details into this issue.
          required: true
